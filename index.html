<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Pro</title>

    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="container">

    <header>
        <h1>📝 Todo Pro</h1>

        <button id="themeBtn" class="theme-btn">
            🌙 Тёмная тема
        </button>
    </header>

    <div class="input-section">
        <input
            type="text"
            id="taskInput"
            placeholder="Введите задачу..."
        >

        <button id="addBtn">
            Добавить
        </button>
    </div>

    <div class="controls">

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Поиск..."
        >

        <div class="filters">
            <button class="filter-btn active" data-filter="all">
                Все
            </button>

            <button class="filter-btn" data-filter="active">
                Активные
            </button>

            <button class="filter-btn" data-filter="completed">
                Выполненные
            </button>
        </div>

    </div>

    <div class="stats">
        <span id="totalTasks">Всего: 0</span>
        <span id="completedTasks">Выполнено: 0</span>
    </div>

    <ul id="taskList"></ul>

</div>

<script src="./js/app.js"></script>

</body>
</html>
